name: Validate thesis workflow
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium --no-shell
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chromium
  latex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended
      - run: node scripts/verify-latex.js /tmp/thesis-output-qa
